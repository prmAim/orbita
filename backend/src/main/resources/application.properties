spring.application.name=Orbita
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orbita}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orbita}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=32
server.address=127.0.0.1
server.shutdown=graceful
server.servlet.session.timeout=-1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.threads.virtual.enabled=true
