name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/verification-scope.yml
  checks:
    needs: scope
    if: ${{ !cancelled() }}
    concurrency:
      # A report-only push must not cancel verification of the preceding code push.
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || needs.scope.outputs.full || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful scope and schema checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.scope.outputs.full != 'false'
      - name: Install uv
        if: needs.scope.outputs.full != 'false'
        run: python -m pip install uv==0.13.7
      - name: Install locked dependencies
        if: needs.scope.outputs.full != 'false'
        run: uv sync --locked
      - name: Check formatting and lint
        if: needs.scope.outputs.full != 'false'
        run: |
          uv run --locked ruff format --check src tests tools
          uv run --locked ruff check src tests tools
      - name: Run tests and offline acceptance
        if: needs.scope.outputs.full != 'false'
        run: |
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked orbita-check
