name: Java and TypeScript checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs cancel older runs; every main push keeps its own check history.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/verification-scope.yml
  verify:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful scope and schema checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.scope.outputs.full != 'false'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.scope.outputs.full != 'false'
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        if: needs.scope.outputs.full != 'false'
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Check and build frontend
        if: needs.scope.outputs.full != 'false'
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: needs.scope.outputs.full != 'false'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend and PostgreSQL integration
        if: needs.scope.outputs.full != 'false'
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check verify
